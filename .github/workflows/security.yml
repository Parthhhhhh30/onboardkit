name: Approved real security scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snyk:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: snyk-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix sample --ignore-scripts --no-audit --no-fund
      - name: Check secure credential availability
        id: credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        shell: bash
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Real security scan: NOT VERIFIED — missing environment secret" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Initialize official scanner (no account credentials)
        if: steps.credentials.outputs.available == 'true'
        run: node_modules/.bin/snyk --version
      - name: Run real scan on isolated sample
        if: steps.credentials.outputs.available == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npm run scan -- --approve-service-use
